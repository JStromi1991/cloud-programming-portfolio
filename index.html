<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TravelVista GmbH – Unternehmenswebsite</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 48px 56px;
      max-width: 560px;
      width: 90%;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      border-top: 5px solid #0078D4;
    }
    .logo { font-size: 40px; margin-bottom: 16px; }
    h1 { font-size: 28px; color: #0078D4; margin-bottom: 8px; }
    .subtitle { font-size: 14px; color: #666; margin-bottom: 32px; }
    .badge {
      display: inline-block;
      background: #EEF5FC;
      color: #0078D4;
      border: 1px solid #B5D4F4;
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 13px;
      margin: 4px;
    }
    .info {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid #eee;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">✈️</div>
    <h1>Willkommen bei TravelVista</h1>
    <p class="subtitle">Ihre Experten für Fernreisen & Luxusreisen</p>
    <span class="badge">Azure Blob Storage</span>
    <span class="badge">Azure CDN</span>
    <span class="badge">Terraform IaC</span>
    <div class="info">
      TravelVista GmbH · München · Cloud Programming Portfolio · DLBSEPCP01_D
    </div>
  </div>
</body>
</html>
